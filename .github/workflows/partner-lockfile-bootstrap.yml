name: Partner lockfile bootstrap

on:
  push:
    branches:
      - bootstrap/partner-lockfile-2026-09-15
    paths:
      - .partner-lock-bootstrap/package.json
      - .github/workflows/partner-lockfile-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Resolve exact dependency graph
        run: npm --prefix .partner-lock-bootstrap install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install from generated lock
        run: |
          rm -rf .partner-lock-bootstrap/node_modules
          npm --prefix .partner-lock-bootstrap ci --ignore-scripts --no-audit --no-fund
          npm --prefix .partner-lock-bootstrap exec -- wrangler --version
      - name: Upload dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partner-package-lock
          path: .partner-lock-bootstrap/package-lock.json
          retention-days: 7
